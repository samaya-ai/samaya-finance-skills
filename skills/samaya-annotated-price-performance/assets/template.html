<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --surface: #ffffff; --surface-2: #f6f7f8; --ink: #181A1E; --ink-soft: #3E4349; --ink-muted: #6b7279;
  --rule: #D7DDD9; --rule-soft: #ecefed; --brand: #0019FF; --brand-ink: #0012B2;
  --price: #3366FF; --bench: #8b9197; --up: #299448; --down: #E01F1A; --none: #9aa1a7;
  --up-soft: rgba(41,148,72,.16); --down-soft: rgba(224,31,26,.14); --band: rgba(51,102,255,.07);
  --vol: #c5cbd0; --vol-ev: #6b7279; --tip-bg: #181A1E; --tip-ink: #ffffff;
  --sans: "Inter", "Inter Variable", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface: #15171a; --surface-2: #1d2024; --ink: #eef0f2; --ink-soft: #c4c9ce; --ink-muted: #8e959c;
    --rule: #33383d; --rule-soft: #24282c; --brand: #6b7dff; --brand-ink: #9aa6ff;
    --price: #6f93ff; --bench: #7d848b; --up: #4cc06c; --down: #ff5a52; --none: #6f767c;
    --up-soft: rgba(76,192,108,.18); --down-soft: rgba(255,90,82,.16); --band: rgba(111,147,255,.10);
    --vol: #3a4046; --vol-ev: #9aa1a7; --tip-bg: #eef0f2; --tip-ink: #15171a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --surface: #15171a; --surface-2: #1d2024; --ink: #eef0f2; --ink-soft: #c4c9ce; --ink-muted: #8e959c;
  --rule: #33383d; --rule-soft: #24282c; --brand: #6b7dff; --brand-ink: #9aa6ff;
  --price: #6f93ff; --bench: #7d848b; --up: #4cc06c; --down: #ff5a52; --none: #6f767c;
  --up-soft: rgba(76,192,108,.18); --down-soft: rgba(255,90,82,.16); --band: rgba(111,147,255,.10);
  --vol: #3a4046; --vol-ev: #9aa1a7; --tip-bg: #eef0f2; --tip-ink: #15171a; color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--surface); color: var(--ink); font: 400 15px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased; }
.num, td.n, .stat b, .tip, .ev-stats dd { font-family: var(--mono); font-variant-numeric: tabular-nums; }
a { color: var(--brand-ink); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 28px 24px 56px; }

header .who { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; color: var(--ink-muted); font-size: 14px; }
header .who strong { color: var(--ink); font-size: 15px; font-weight: 650; }
h1 { font-size: clamp(22px, 3.1vw, 32px); line-height: 1.18; font-weight: 640; letter-spacing: -0.015em;
  margin: 10px 0 10px; max-width: 46ch; text-wrap: balance; }
.standfirst { font-size: 16px; color: var(--ink-soft); margin: 0 0 16px; max-width: 70ch; }
.phases { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 0; margin: 4px 0 18px; border-top: 1px solid var(--rule); }
.phase { padding: 12px 18px 12px 0; border-bottom: 1px solid var(--rule-soft); }
.phase + .phase { padding-left: 18px; border-left: 1px solid var(--rule-soft); }
@media (max-width: 760px) { .phase + .phase { padding-left: 0; border-left: 0; } }
.phase .ph-top { display: flex; align-items: baseline; gap: 8px; }
.phase .ph-l { font: 600 12px var(--mono); color: var(--ink-muted); }
.phase h3 { font-size: 15px; font-weight: 640; margin: 0; letter-spacing: -0.005em; }
.phase .ph-d { font-size: 12.5px; color: var(--ink-muted); margin: 2px 0 6px; }
.phase .ph-r { font: 500 22px var(--mono); font-variant-numeric: tabular-nums; margin: 0; }
.phase .ph-s { font: 12px var(--mono); color: var(--ink-muted); margin: 0 0 8px; }
.phase p.ph-t { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 8px; }
.ph-ev { display: flex; flex-wrap: wrap; gap: 6px; }
.ph-ev button { font: 500 12px var(--sans); border: 1px solid var(--rule); background: var(--surface); color: var(--ink-soft); border-radius: 999px; padding: 2px 9px 2px 3px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.ph-ev button:focus-visible { outline: 2px solid var(--brand); }
.ph-ev .idx { width: 17px; height: 17px; font-size: 10px; }
.ph-src { font-size: 12px; color: var(--ink-muted); margin: 6px 0 0; }
.next { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 18px; }
.next b { color: var(--ink); font-weight: 600; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 28px; margin: 0 0 22px; padding: 0; list-style: none; font-size: 13.5px; color: var(--ink-soft); }
.stat b { font-weight: 500; font-size: 14px; margin-left: 6px; }
.pos { color: var(--up); } .neg { color: var(--down); }

.controls { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-bottom: 8px; font-size: 13.5px; color: var(--ink-soft); }
.controls label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.controls input { accent-color: var(--price); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; }
.seg button { font: 500 13px var(--sans); color: var(--ink-soft); background: var(--surface); border: 0; padding: 6px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg button:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }
.dia { width: 9px; height: 9px; background: var(--bench); transform: rotate(45deg); display: inline-block; }
.legend { display: inline-flex; flex-wrap: wrap; gap: 4px 14px; margin-left: auto; color: var(--ink-muted); font-size: 12.5px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
.dot.c { background: var(--ink-soft); } .dot.r { background: var(--surface); border: 2px solid var(--ink-soft); }
.dot.u { background: var(--surface); border: 1.5px dashed var(--none); }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 24px; align-items: start; }
@media (max-width: 960px) { .main { grid-template-columns: 1fr; } }
.chartbox { position: relative; }
svg#chart { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
svg text { font-family: var(--sans); }
svg text.halo { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.axis text { fill: var(--ink-muted); font-size: 11px; font-family: var(--mono); }
.mk { cursor: pointer; outline: none; }
.mk:focus-visible circle.ring { stroke: var(--brand); stroke-width: 3; }
.mk text { font: 600 11px var(--sans); pointer-events: none; }
.tip { position: absolute; pointer-events: none; background: var(--tip-bg); color: var(--tip-ink); font-size: 11.5px;
  line-height: 1.55; padding: 8px 10px; border-radius: 6px; white-space: nowrap; display: none; z-index: 5; }
.tip .d { font-family: var(--sans); font-weight: 600; margin-bottom: 2px; }
.caption { font-size: 12.5px; color: var(--ink-muted); margin: 8px 0 0; max-width: 90ch; }

aside.detail { border-left: 3px solid var(--rule); padding: 2px 0 2px 18px; min-height: 200px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
@media (max-width: 960px) { aside.detail { position: static; border-left: 0; border-top: 3px solid var(--rule); padding: 16px 0 0; } }
aside.detail.dn { border-color: var(--down); } aside.detail.up { border-color: var(--up); } aside.detail.na { border-color: var(--none); }
.ev-date { color: var(--ink-muted); font-size: 13px; margin: 0; }
.ev-title { font-size: 19px; line-height: 1.25; font-weight: 640; margin: 4px 0 8px; letter-spacing: -0.01em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-soft); border: 1px solid var(--rule-soft); }
.chip.t-confirmed { color: var(--surface); background: var(--ink-soft); border-color: var(--ink-soft); }
.chip.t-none { border-style: dashed; }
.muted { color: var(--ink-muted); }
.ev-stats { display: grid; grid-template-columns: repeat(3, auto); gap: 2px 16px; margin: 0 0 14px; justify-content: start; }
.ev-stats dt { font-size: 11.5px; color: var(--ink-muted); }
.ev-stats dd { margin: 0 0 6px; font-size: 14px; font-weight: 500; }
.ev-body { font-size: 14.5px; color: var(--ink-soft); margin: 0 0 10px; }
.ev-follow { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 12px; padding: 8px 10px; background: var(--surface-2); border-radius: 6px; }
.ev-src { font-size: 12.5px; margin: 0; padding: 0; list-style: none; }
.ev-src li { margin: 0 0 6px; color: var(--ink-muted); }
.hint { color: var(--ink-muted); font-size: 14px; }
.navbtns { display: flex; gap: 8px; margin-top: 14px; }
button.nav { font: 500 13px var(--sans); color: var(--ink-soft); background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
button.nav:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }

h2 { font-size: 17px; font-weight: 640; margin: 40px 0 10px; letter-spacing: -0.005em; }
.tbl { overflow-x: auto; border-top: 1px solid var(--rule); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; min-width: 760px; }
th { text-align: left; font-weight: 500; color: var(--ink-muted); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--rule-soft); vertical-align: top; }
td.n, th.n { text-align: right; white-space: nowrap; }
tr.row { cursor: pointer; } tr.row:hover td, tr.row.sel td { background: var(--surface-2); }
tr.row:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }
.idx { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font: 600 11px var(--sans); color: #fff; }
.method { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 8px 32px; font-size: 13.5px; color: var(--ink-soft); }
.method p { margin: 0 0 10px; }
.sources { font-size: 12.5px; color: var(--ink-muted); padding-left: 18px; }
.sources li { margin-bottom: 4px; }
.other { font-size: 13px; color: var(--ink-muted); }
@media (prefers-reduced-motion: no-preference) { aside.detail > * { animation: none; } }

/* --- declutter pass --- */
header .who { margin: 0; }
.keys { margin: 0 0 20px; font-size: 14px; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 4px 22px; }
.keys b { font: 500 14px var(--mono); font-variant-numeric: tabular-nums; margin-left: 6px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 0 0 22px; }
@media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 620px) { .tiles { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 10px; margin-right: -24px; padding-right: 24px; } .tile { flex: 0 0 78%; scroll-snap-align: start; } }
.tile { text-align: left; font: inherit; color: inherit; background: var(--surface-2); border: 1px solid transparent; border-radius: 10px; padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.tile:hover, .tile[aria-pressed="true"] { border-color: var(--rule); background: var(--surface); }
.tile:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.tile .t-l { font: 600 11.5px var(--mono); color: var(--ink-muted); }
.tile .t-h { font-size: 15px; font-weight: 640; line-height: 1.25; letter-spacing: -0.005em; }
.tile .t-r { font: 500 24px var(--mono); font-variant-numeric: tabular-nums; line-height: 1.1; margin-top: 2px; }
.tile .t-s { font: 12px var(--mono); color: var(--ink-muted); }
.tile .t-x { font-size: 13px; color: var(--ink-soft); line-height: 1.45; margin-top: 2px; }
.tile .t-n { font-size: 12.5px; color: var(--ink); font-weight: 600; margin-top: 4px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-bottom: 6px; }
.bar .legend { margin-left: auto; }
.opts { position: relative; font-size: 13px; color: var(--ink-soft); }
.opts summary { cursor: pointer; list-style: none; border: 1px solid var(--rule); border-radius: 7px; padding: 5px 10px; }
.opts summary::-webkit-details-marker { display: none; }
.opts[open] summary { background: var(--surface-2); }
.opts-in { position: absolute; right: 0; top: calc(100% + 6px); z-index: 6; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; min-width: 210px; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
.opts-in label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.opts-in input { accent-color: var(--price); }
.ev-meta { font-size: 12.5px; color: var(--ink-muted); margin: 0 0 12px; }
.ev-nums { display: flex; gap: 20px; margin: 0 0 12px; }
.ev-nums div { display: flex; flex-direction: column; }
.ev-nums span { font-size: 11.5px; color: var(--ink-muted); }
.ev-nums b { font: 500 16px var(--mono); font-variant-numeric: tabular-nums; }
.ev-foot { font-size: 12.5px; color: var(--ink-muted); margin: 0 0 10px; }
details.ev-srcs summary, details.more summary { cursor: pointer; color: var(--ink-soft); font-size: 13px; }
details.ev-srcs { margin: 0 0 12px; }
details.ev-srcs ul { margin: 8px 0 0; }
details.more { border-top: 1px solid var(--rule); padding: 12px 0; }
details.more summary { font-size: 15px; font-weight: 600; color: var(--ink); }
details.more[open] summary { margin-bottom: 10px; }
.ev-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ev-step { display: flex; gap: 4px; }
.ev-step button { font: 500 14px var(--sans); width: 28px; height: 26px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--ink-soft); cursor: pointer; }
.tier { display: inline-flex; align-items: center; gap: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="who"><strong id="tk"></strong> <span id="co"></span> <span id="win"></span></p>
    <h1 id="headline"></h1>
    <p class="keys" id="keys"></p>
  </header>

  <div class="tiles" id="phases"></div>

  <div class="bar">
    <div class="seg" role="group" aria-label="View"><button type="button" data-view="price" aria-pressed="true">Price</button><button type="button" data-view="daily" aria-pressed="false">Daily split</button><button type="button" data-view="rel" aria-pressed="false">Cumulative split</button></div>
    <div class="legend" aria-hidden="true"><span><i class="dot c"></i>Confirmed</span><span><i class="dot r"></i>Reported</span><span><i class="dot u"></i>No catalyst</span></div>
    <details class="opts"><summary>Display</summary><div class="opts-in">
      <label><input type="checkbox" id="optBench" checked> <span id="benchLbl">Normal-range band</span></label>
      <label><input type="checkbox" id="optMkt" checked> Market-driven days</label>
      <label><input type="checkbox" id="optNone" checked> <span id="noneLbl">No catalyst found</span></label>
      <label><input type="checkbox" id="optTurn"> Turning points</label>
    </div></details>
  </div>

  <div class="main">
    <div>
      <div class="chartbox" id="box">
        <svg id="chart" role="img" aria-label="Daily price and volume with annotated event days"></svg>
        <div class="tip" id="tip"></div>
      </div>
      <p class="caption" id="caption"></p>
    </div>
    <aside class="detail" id="detail" aria-live="polite"></aside>
  </div>

  <h2>Event days</h2>
  <div class="tbl"><table id="ledger"></table></div>
  <p class="other" id="other"></p>

  <details class="more"><summary id="mktSum">Large moves the market explained</summary><p class="other" id="mktIntro"></p><div class="tbl"><table id="mktTable"></table></div></details>
  <details class="more"><summary>How this chart is built</summary><div class="method" id="method"></div></details>
  <details class="more"><summary id="srcSum">Sources</summary><ol class="sources" id="sources"></ol></details>
</div>

<script id="data" type="application/json">/*__DATA__*/</script>
<script>
(function () {
const D = JSON.parse(document.getElementById("data").textContent);
const days = D.days, N = days.length, EV = D.events, MK = D.market_moves || [];
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const el = (t, a, p) => { const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); if (p) p.appendChild(n); return n; };
const pct = (x, d = 1) => { if (d === 0 && Math.abs(x) < 0.01) d = 1; return (x >= 0 ? "+" : "\u2212") + Math.abs(x * 100).toFixed(d) + "%"; };
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtD = s => { const [y, m, d] = s.split("-"); return +d + " " + MON[+m - 1] + " " + y; };
const fmtDs = s => { const [, m, d] = s.split("-"); return +d + " " + MON[+m - 1]; };
const fmtV = v => (v / 1e6).toFixed(1) + "M";
const idxOf = {}; days.forEach((d, i) => idxOf[d.date] = i);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const mkSet = new Set(MK.map(m => m.date));
const ctxOf = {}; (D.context_events || []).forEach(c => ctxOf[c.date] = c.label);
let view = "price", sel = null;

// cumulative split: stock-specific (product of 1 + market-adjusted move) and market-explained (product of 1 + beta x benchmark)
const specCum = [], mktCum = []; let a = 1, b = 1;
days.forEach(d => { a *= 1 + d.abn; b *= 1 + d.mkt; specCum.push(a - 1); mktCum.push(b - 1); });

// ---------- header ----------
const S = D.summary;
$("tk").textContent = D.ticker; $("co").textContent = D.company;
$("win").textContent = fmtD(D.window[0]) + " to " + fmtD(D.window[1]);
$("headline").textContent = D.headline;
const key = (k, v) => `<span>${k}<b class="${v >= 0 ? "pos" : "neg"}">${pct(v, 0)}</b></span>`;
$("keys").innerHTML = key(D.ticker, S.total_ret) + key(D.benchmark, S.bench_ret) + key("Stock-specific", S.spec_part) + key("Market-explained", S.mkt_part);
const nNone = EV.filter(e => e.tier === "none").length;
$("noneLbl").textContent = "No catalyst found (" + nNone + ")";
let hiPhase = null;

// ---------- chart ----------
const svg = $("chart"), box = $("box"), tip = $("tip");
const maxAbn = Math.max(...EV.map(e => Math.abs(e.abn)));
const visible = e => e.tier !== "none" || $("optNone").checked;

function draw() {
  const W = Math.max(340, box.clientWidth), narrow = W < 620;
  const padL = narrow ? 40 : 52, padR = narrow ? 10 : 16, priceH = narrow ? 250 : 340, gap = 14, volH = narrow ? 88 : 124, axisH = 22;
  const x0 = padL, x1 = W - padR;
  const X = i => x0 + (x1 - x0) * (i + 0.5) / N, bw = Math.max(1, (x1 - x0) / N * 0.72);
  // marker size follows the stock-specific move; markers stack onto another row rather than touch
  const rMin = narrow ? 7 : 8, rMax = narrow ? 11 : 13.5;
  const R = e => rMin + (rMax - rMin) * Math.sqrt(Math.abs(e.abn) / maxAbn);
  const rowH = rMax * 2 + 4, slots = {}, lastEdge = [];
  EV.forEach((e, k) => { if (!visible(e)) return; const xm = (X(idxOf[e.dates[0]]) + X(idxOf[e.dates[e.dates.length - 1]])) / 2, r = R(e);
    let row = 0; while (lastEdge[row] != null && xm - r < lastEdge[row] + 3) row++; lastEdge[row] = xm + r; slots[k] = { xm, row, r }; });
  const nRows = Math.max(1, lastEdge.length), rail = 12 + nRows * rowH;
  const H = rail + priceH + gap + volH + axisH;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  const py0 = rail, py1 = rail + priceH, vy0 = py1 + gap, vy1 = vy0 + volH;
  const showB = $("optBench").checked, rel = view === "rel", daily = view === "daily";
  const RULE = css("--rule-soft"), MUT = css("--ink-muted");

  // series for the current view
  const tipOf = d => d.mkt * d.abn >= 0 ? d.mkt + d.abn : (Math.abs(d.abn) > Math.abs(d.mkt) ? d.abn : d.mkt);
  const band = days.map(d => D.params.z_min * d.sig);
  const main = daily ? days.map(tipOf) : rel ? specCum : days.map(d => d.c);
  const second = daily ? null : rel ? mktCum : days.map(d => d.bench / days[0].bench * D.base_close);
  let lo, hi;
  if (daily) { const v = days.flatMap(d => [d.mkt, d.abn, d.mkt + d.abn, 0]); lo = Math.min(...v); hi = Math.max(...v);

function niceTicks(lo, hi, logS) {
  if (logS) return [10, 20, 25, 30, 40, 50, 60, 75, 100, 125, 150, 200, 250, 300, 400, 500, 750, 1000].filter(t => t >= lo * 0.9 && t <= hi * 1.1);

  const out = []; for (let t = Math.ceil(lo / step) * step; t <= hi; t += step) out.push(+t.toFixed(6)); return out;
}
function relTicks(lo, hi) { return [-0.9, -0.8, -0.75, -0.6, -0.5, -0.4, -0.3, -0.2, -0.1, 0, 0.1, 0.2, 0.3, 0.5, 0.75, 1, 1.5, 2].filter(v => v >= lo - 0.02 && v <= hi + 0.02); }

function method() {
  const P = D.params;
  $("method").innerHTML = `
  <div><p><b>Which days get a marker.</b> Each day's move is split into a market part (the stock's ${P.est_win}-day beta \u00D7 ${D.benchmark}'s move) and a stock-specific part (the rest). A day is marked when the stock-specific part is at least ${P.z_min}\u00D7 the stock's normal daily variation and volume is at least ${P.rvol_min}\u00D7 its 50-day median, or at least ${P.z_always}\u00D7 normal on any volume. Every marked day is researched; none are dropped to fit a limit.</p>
  <p><b>Daily split.</b> Each bar is one day: grey is the market part, colour is the stock-specific part. The shaded band is ${P.z_min}× the stock's typical stock-specific move; a coloured segment beyond it is a screened day. Event days are drawn solid.</p>
  <p><b>Cumulative split.</b> This view compounds the two parts separately. The stock-specific line moves only on company news and stock-specific trading; the market-explained line is what the stock would have done if it had only tracked ${D.benchmark} at its beta. The two compound to roughly the total return.</p></div>
  <div><p><b>Attribution.</b> A cause must be published before the close of the session it is said to have moved. A release after 16:00 ET moves the next session. "Company-confirmed" means a timestamped company release or filing in that window. "Reported in news" means only secondary coverage was found. "No catalyst found" days are shown, not hidden: a large move with no cause is information too. Rating changes on the same day as a company release are a reaction to it, not its cause.</p>
  <p><b>Beat or miss</b> is measured against the company's own prior guidance. Street consensus is not used.</p></div>
  <div><p><b>Volume.</b> Coloured bars are event days. Dashed outlined bars are results-release days whose volume includes after-hours trading on the release; the reaction day carries the volume test instead.</p>
  <p><b>Scale.</b> ${D.log_scale_note}</p></div>`;
  const src = [...D.sources.stock, ...D.sources.bench], seen = new Set(src.map(s => s.url));
  EV.forEach(e => e.sources.forEach(s => { if (!seen.has(s.url)) { seen.add(s.url); src.push(s); } }));
  $("srcSum").textContent = "Sources (" + src.length + ")";
  $("sources").innerHTML = src.map(s => `<li><a href="${s.url}" target="_blank" rel="noopener">${esc(s.title)}</a>${s.source_name ? ", " + esc(s.source_name) : ""}</li>`).join("");
  $("caption").textContent = `Daily candles for ${D.ticker} and ${D.benchmark}, Market Data via Samaya, as of ${fmtD(D.as_of)}. Grey is the market part of each day's move (beta \u00D7 ${D.benchmark}); colour is the stock-specific part. Letters mark the phases above.`;
}

document.querySelectorAll(".seg button").forEach(btn => btn.addEventListener("click", () => {
  view = btn.dataset.view; document.querySelectorAll(".seg button").forEach(b2 => b2.setAttribute("aria-pressed", b2 === btn));
  $("benchLbl").textContent = view === "rel" ? "Market-explained line" : view === "daily" ? "Normal-range band" : D.benchmark_name + " (rebased)"; draw(); }));
$("benchLbl").textContent = D.benchmark_name + " (rebased)";
["optBench", "optTurn", "optNone", "optMkt"].forEach(id => $(id).addEventListener("change", () => { if (sel != null && !visible(EV[sel])) { sel = null; emptyDetail(); } draw(); }));
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(draw, 80); });
if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
emptyDetail(); tables(); method(); phases(); draw();
})();
</script>
</body>
</html>
